COM_DPCALENDAR_NOTIFICATION_BOOKING_UPDATE_SUBJECT="Powiadomienie o zaktualizowanej rezerwacji {{bookingUid}} od {{user}}"
COM_DPCALENDAR_NOTIFICATION_BOOKING_UPDATE_BODY="<p>Witaj</p><p>Rezerwacja <a href='{{bookingLink}}'>{{bookingUid}}</a>, która zawiera bilety na następujące wydarzenia, została zaktualizowana przez użytkownika {{user}}:<ul>{{#events}}<li><a href='{{backLinkFull}}'>{{title}}</a> {{date}}</li>{{/events}}</ul> Szczegóły rezerwacji: {{{bookingDetails}}}<br/><br/><p>Z poważaniem {{sitename}}</p>"
COM_DPCALENDAR_NOTIFICATION_BOOKING_DELETE_SUBJECT="Powiadomienie o usuniętej rezerwacji {{bookingUid}} od {{user}}"
COM_DPCALENDAR_NOTIFICATION_BOOKING_DELETE_BODY="<p>Witaj</p><p>Rezerwacja <a href='{{bookingLink}}'>{{bookingUid}}</a> została usunięta przez użytkownika {{user}}. Szczegóły rezerwacji: {{{bookingDetails}}}<br/><br/><p>Z poważaniem {{sitename}}</p>"
COM_DPCALENDAR_NOTIFICATION_EVENT_BOOK_USER_SUBJECT="Gratulacje, rezerwacja w {{sitename}} została utworzona"
COM_DPCALENDAR_NOTIFICATION_EVENT_BOOK_USER_BODY="<p>Witaj</p><p>Dziękujemy za wykonanie rezerwacji na {{sitename}}. Zauważ że wydarzenie to możesz dodać do swojego kalendarza klikając na ikonę w prawym rogu. Dla twojej wygody przesyłamy szczegóły rezerwacji:{{{bookingDetails}}}<br/><br/>Możesz zobaczyć szczegóły swojej rezerwacji lub edytować szczegóły biletów<a href='{{bookingLink}}'>tutaj</a>.<p>Pozdrawiamy {{sitename}}</p>"
COM_DPCALENDAR_NOTIFICATION_EVENT_BOOK_USER_PAYED_SUBJECT="Gratulacje, twoja rezerwacja na {{sitename}} została opłacona"
COM_DPCALENDAR_NOTIFICATION_EVENT_BOOK_USER_PAYED_BODY="<p>Witaj</p><p>Dziękujemy za rezerwacje <a href='{{bookingLink}}'>{{bookingUid}}</a> na stronie {{sitename}}. Została dołączona do maila faktura w wersjci PDF pliku.</p><p>Dla twojej wygody podajemy szczegóły rezerwacji:{{{bookingDetails}}}.<p>Pozdrawiamy {{sitename}}</p>"
COM_DPCALENDAR_NOTIFICATION_EVENT_BOOK_USER_WAITING_SUBJECT="Dodaliśmy Cię do listy oczekujących na wydarzenie {{#events}}{{title}}{{/events}}"
COM_DPCALENDAR_NOTIFICATION_EVENT_BOOK_USER_WAITING_BODY="<p>Witaj</p>, niestety wydarzenie {{#events}}{{title}}{{/events}} jest już zarezerwowane, ale dodaliśmy Cię do listy oczekujących. Otrzymasz powiadomienie, aby dokończyć rezerwację, kiedy będzie wolne miejsce. W załączniku do tego e-maila znajduje się plik ics, który można zaimportować do aplikacji kalendarza. Dla Twojej wygody podajemy szczegóły Twojej rezerwacji: {{{bookingDetails}}} <br/><br/><a href='{{bookingLink}}'>Tutaj</a> możesz wyświetlić szczegóły swojej rezerwacji lub edytować posiadaczy biletów.<p>Z poważaniem {{sitename}}</p>"
COM_DPCALENDAR_NOTIFICATION_EVENT_BOOK_USER_INVITE_SUBJECT="{{#events}}Otrzymałeś/łaś zaproszenie na wydarzenie {{title}} które odbędzie się {{startDate}}{{/events}}"
COM_DPCALENDAR_NOTIFICATION_EVENT_BOOK_USER_INVITE_BODY="<p>Witaj</p>{{#events}}<p>Zostałeś zaproszony na wydarzenie <a href='{{backLinkFull}}'>{{title}}</a> w dniu {{date}}.<p>{{/events}}<p>Chcesz <a href='{{acceptUrl}}'>przyjąć</a> zaproszenie czy <a href='{{declineUrl}}'>odrzucić</a>?</p><p>Z poważaniem {{sitename}}</p>"
COM_DPCALENDAR_NOTIFICATION_TICKET_UPDATE_SUBJECT="Bilet {{ticketUid}} został zaktualizowany"
COM_DPCALENDAR_NOTIFICATION_TICKET_UPDATE_BODY="<p>Witaj</p><p>Bilet <a href='{{ticketLink}}'>{{ticketUid}}</a> na wydarzenie {{#events}}<a href='{{backLinkFull}}'>{{title}}</a> w dniu {{date}}{{/events}} został zaktualizowany przez {{user}}. Szczegóły biletu: {{{ticketDetails}}}<br/><br/><p>Z poważaniem {{sitename}}</p>"
COM_DPCALENDAR_NOTIFICATION_TICKET_CHECKED_IN_SUBJECT="Gratulacje, twoja obecność na wydarzeniu {{#events}}{{title}}{{/events}} została potwierdzona"
COM_DPCALENDAR_NOTIFICATION_TICKET_CHECKED_IN_BODY="<p>Witaj</p><p>Dziękujemy za uczestnictwo w wydarzeniu {{#events}}{{title}} [{{date}}]{{/events}}. W załączniku do tego e-maila znajduje się twój certyfikat w formacie PDF.</p><p>Dla twojej wygody podajemy szczegóły biletu:{{{ticketDetails}}}.<p>Z poważaniem {{sitename}}</p>"
COM_DPCALENDAR_BOOK_NOTIFICATION_SEND_SUBJECT="Faktura za rezerwację {{bookingUid}} pod adresem {{sitename}}"
COM_DPCALENDAR_BOOK_NOTIFICATION_SEND_BODY="<p>Witam</p><p>W załączeniu znajduje się <a href='{{bookingLink}}'>faktura</a> za rezerwację {{bookingUid}} pod adresem {{sitename}}. Szczegóły rezerwacji: {{{bookingDetails}}}<br/><br/><p>Z poważaniem {{sitename}}</p>"
COM_DPCALENDAR_TICKET_NOTIFICATION_SEND_SUBJECT="Bilet na wydarzenie {{#events}}{{{title}}}{{/events}} w {{sitename}}"
COM_DPCALENDAR_TICKET_NOTIFICATION_SEND_BODY="<p>Witam</p><p>W załączeniu przesyłamy <a href='{{ticketLink}}'>bilet</a> na wydarzenie {{#events}}<a href='{{backLinkFull}}'>{{title}}</a> w dniu {{date}} {{/events}}. Szczegóły biletu: {{{ticketDetails}}}<br/><br/><p>Z poważaniem {{sitename}}</p>"
COM_DPCALENDAR_NOTIFICATION_LOCATION_CREATE_SUBJECT="Lokalizacja {{#location}}{{{title}}}{{/location}} została utworzona"
COM_DPCALENDAR_NOTIFICATION_LOCATION_CREATE_BODY="<p>Witaj</p><p>Lokalizacja {{#location}}<a href='{{backLinkFull}}'>{{formattedAddress}}{{/location}}</a> została utworzona przez użytkownika {{user}}.<p><p>Z poważaniem {{sitename}}</p>"
COM_DPCALENDAR_NOTIFICATION_LOCATION_UPDATE_SUBJECT="Lokalizacja {{#location}}{{{title}}}{{/location}} została zaktualizowana"
COM_DPCALENDAR_NOTIFICATION_LOCATION_UPDATE_BODY="<p>Witaj</p><p>Lokalizacja {{#location}}<a href='{{backLinkFull}}'>{{formattedAddress}}{{/location}}</a> została zaktualizowana przez użytkownika {{user}}.</p><p>Z poważaniem {{sitename}}</p>"
COM_DPCALENDAR_NOTIFICATION_LOCATION_DELETE_SUBJECT="Lokalizacja {{#location}}{{{title}}}{{/location}} została usunięta"
COM_DPCALENDAR_NOTIFICATION_LOCATION_DELETE_BODY="<p>Witaj</p><p>Lokalizacja {{#location}}<a href='{{backLinkFull}}'>{{formattedAddress}}{{/location}}</a> została usunięta przez użytkownika {{user}}.</p><p>Z poważaniem {{sitename}}</p>"
