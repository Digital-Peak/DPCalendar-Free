JLIB_RULES_SETTING_NOTES="1. Jeśli zmienisz ustawienie, zastosuje się do tego składnika. Należy pamiętać, że: <br/> <em>dziedziczone</em> oznacza, że uprawnienia z grupy globalnej konfiguracji i rodzic będzie używana. <br/><em>odmowa</em> oznacza, że bez względu na to, jakie są ustawienia konfiguracji lub nadrzędny grupy globalne, Grupa edytowany nie biorą tego działania na ten składnik. <br/> <em>dozwolone</em> oznacza, że grupa edytowany będzie w stanie podjąć tę akcję dla tego składnika (ale jeśli to jest w konflikcie z grupy globalnej konfiguracji lub nadrzędny to będzie miała żadnego wpływu; konflikt jest sygnalizowane przez <em>Niedozwolone (zablokowane)</em> w obszarze Ustawienia obliczane). <br/> 2. Po wybraniu nowego ustawienia, kliknij przycisk <em>Zapisz</em> aby odświeżyć ustawienia obliczone."
